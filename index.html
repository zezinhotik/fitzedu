<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c">
<meta name="description" content="Fit Evolution — dieta, treino, cardio e evolução para recomposição corporal.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fit Evolution</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0b0d0c; --s1:#131715; --s2:#1a1f1c; --s3:#232a26; --line:#2a322d;
  --tx:#ecf2ed; --mu:#8d988f; --mu2:#5f6a62;
  --ac:#b6ff3b; --ac-d:#8fd61a; --ac-bg:rgba(182,255,59,.12); --ac-line:rgba(182,255,59,.4); --ac-glow:rgba(182,255,59,.35); --on-ac:#0b0d0c;
  --p:#5eead4; --c:#fbbf24; --g:#f472b6; --bad:#ff6b6b; --warn:#fbbf24;
  --r:16px; --nav:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(11,13,12,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand b{color:var(--ac)}
.logo-dot{width:10px;height:10px;border-radius:3px;background:var(--ac);box-shadow:0 0 12px var(--ac)}
.top-sub{color:var(--mu);font-size:13px}

main{max-width:560px;margin:0 auto;padding:14px 16px calc(var(--nav) + 90px + var(--safe-b))}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(15,18,16,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);font-size:11px;padding:4px 0}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--ac)}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:500;color:var(--mu);font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600}
.hello{margin:4px 2px 14px}
.hello h1{font-size:24px}
.hello p{margin:2px 0 0;color:var(--mu)}
.muted{color:var(--mu)} .small{font-size:12.5px}
.ac{color:var(--ac)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grow{flex:1;min-width:0}
.empty{color:var(--mu);font-size:13.5px;text-align:center;padding:18px 8px}
.sep{height:1px;background:var(--line);margin:12px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--s3);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.06)}
.btn.block{width:100%}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.98)}
.link{color:var(--ac);font-weight:600;font-size:13px}

/* ring + macros */
.kcal{display:flex;align-items:center;gap:16px}
.ring-box{position:relative;width:128px;height:128px;flex:none}
.ring{width:128px;height:128px}
.ring circle{fill:none;stroke-width:11}
.ring-bg{stroke:var(--s3)}
.ring-fg{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .5s;filter:drop-shadow(0 0 6px var(--ac-glow))}
.ring-fg.over{stroke:var(--warn)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-size:24px;line-height:1}
.ring-c span{font-size:11.5px;color:var(--mu)}
.mbars{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.mbar-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);margin-bottom:4px}
.mbar-top b{color:var(--tx)}
.track{height:7px;background:var(--s3);border-radius:9px;overflow:hidden}
.fill{height:100%;border-radius:9px;background:var(--ac);transition:width .4s}
.fill.p{background:var(--p)} .fill.c{background:var(--c)} .fill.g{background:var(--g)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dot.p{background:var(--p)} .dot.c{background:var(--c)} .dot.g{background:var(--g)}

.stat{background:var(--s2);border-radius:12px;padding:12px}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.stat .d{font-size:12px;margin-top:2px}

.rem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rem:first-of-type{border-top:0;padding-top:0}
.rem .ic{width:30px;height:30px;border-radius:9px;background:var(--ac-bg);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}

/* date nav + segmented */
.dnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px}
.dnav button{width:40px;height:36px;border-radius:10px;color:var(--mu);font-size:20px}
.dnav button:active{background:var(--s3)}
.dnav .lbl{font-weight:600;text-align:center}
.dnav .lbl small{display:block;color:var(--mu);font-weight:400;font-size:11.5px}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;color:var(--mu);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--s3);color:var(--tx)}

/* diet */
.meal-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.meal-h h3{margin:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-child{border-top:0}
.item .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mc{font-size:12px;color:var(--mu)}
.item .kc{font-weight:700;font-size:14px;text-align:right}
.add-row{margin-top:8px}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.totals div{background:var(--s2);border-radius:10px;padding:8px 4px}
.totals b{display:block;font-size:16px}
.totals span{font-size:11px;color:var(--mu)}

/* list */
.list-it{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list-it:last-child{border-bottom:0}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--s3);color:var(--mu);font-weight:600;vertical-align:middle;margin-left:4px}
.tag.ac{background:var(--ac-bg);color:var(--ac)}

/* training */
.plan-h .t{font-size:19px;font-weight:700}
.chip{display:inline-block;background:var(--ac-bg);color:var(--ac);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.ex.done{border-color:var(--ac-line)}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;width:100%;text-align:left}
.ex-h .n{font-weight:700;font-size:15px}
.ex-h .rx{color:var(--mu);font-size:12.5px}
.last{font-size:12px;color:var(--mu);margin-bottom:8px}
.last b{color:var(--tx);font-weight:600}
.set{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:6px}
.set .i{color:var(--mu);font-size:13px;text-align:center;font-weight:600}
.set input{text-align:center;padding:9px 6px}
.set-lbl{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;font-size:11px;color:var(--mu2);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.chk{height:40px;border-radius:11px;background:var(--s3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mu)}
.chk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chk.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.set.ok input{border-color:var(--ac-line)}
.prog{height:6px;background:var(--s3);border-radius:6px;overflow:hidden;margin-top:10px}
.prog div{height:100%;background:var(--ac)}

.rest{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + var(--safe-b));z-index:25;max-width:536px;margin:0 auto;background:var(--s2);border:1px solid var(--ac-line);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.rest-fill{position:absolute;left:0;top:0;bottom:0;background:var(--ac-bg);transition:width .25s linear}
.rest-row{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px}
.rest-l{color:var(--mu);font-size:13px}
.rest-t{flex:1;font-size:22px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.rest button{background:var(--s3);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--mu2);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;color:var(--mu);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 4px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
.insight{background:var(--ac-bg);border:1px solid var(--ac-line);border-radius:12px;padding:12px;font-size:13.5px}
.insight.w{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3)}

/* photos */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--s2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.65);font-size:10.5px;padding:2px 6px;border-radius:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp .ph{aspect-ratio:3/4}

/* forms */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:5px;font-weight:600}
.hint{font-size:12px;color:var(--mu);margin-top:5px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--s3);border:1px solid var(--line);border-radius:20px;transition:.2s}
.switch span:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:var(--mu);border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ac);border-color:var(--ac)}
.switch input:checked+span:after{transform:translateX(18px);background:#0b0d0c}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + var(--safe-b));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--s3);margin:4px auto 12px}
.sheet h2{font-size:18px;margin-bottom:12px}
.sheet-x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--s2);color:var(--mu);font-size:18px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 20px + var(--safe-b));z-index:60;background:var(--tx);color:#0b0d0c;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.ed-ex{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.ed-ex .grid3 input{padding:8px}
.ico-btn{width:34px;height:34px;border-radius:9px;background:var(--s3);color:var(--mu);display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.ex-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.ex-top .ex-h{margin-bottom:0;flex:1;min-width:0}
.demo{position:relative;width:78px;height:78px;flex:none;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img.b{animation:demoflip 1.6s steps(1) infinite}
.demo.big{width:100%;height:auto;aspect-ratio:4/3;border-radius:14px}
.demo.big img{object-fit:contain}
.demo .play{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:6px;letter-spacing:.04em}
.demo.none{display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--mu2);font-size:10.5px;text-align:center;padding:4px}
@keyframes demoflip{0%{opacity:0}50%{opacity:1}}
html[data-theme="pink"]{--bg:#0f0b0d;--s1:#181215;--s2:#20181c;--s3:#2b2026;--line:#35272e;--tx:#f6eef2;--mu:#a3929a;--mu2:#6e5d65;
  --ac:#ff5fa2;--ac-d:#e23d86;--ac-bg:rgba(255,95,162,.13);--ac-line:rgba(255,95,162,.45);--ac-glow:rgba(255,95,162,.4);--g:#c4a1ff;--on-ac:#1a0b12}
html[data-theme="pink"] .topbar{background:rgba(15,11,13,.88)}
html[data-theme="pink"] .tabbar{background:rgba(20,14,17,.96)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.who button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-weight:600;font-size:14px;text-align:left}
.who button .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b0d0c;flex:none}
.who button .av.g{background:#b6ff3b}.who button .av.p{background:#ff5fa2;color:#1a0b12}
.who button.on{border-color:var(--ac);color:var(--tx);background:var(--ac-bg)}
.who button small{display:block;font-weight:500;font-size:11px;color:var(--mu)}
.foot{color:var(--mu2);font-size:11.5px;text-align:center;margin:18px 8px 0}
body:has(#rest:not([hidden])) .toast{bottom:calc(var(--nav) + 86px + var(--safe-b))}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo-dot"></span>Fit <b>Evolution</b></div>
  <div id="topSub" class="top-sub"></div>
</header>

<main id="view"></main>

<div id="rest" class="rest" hidden>
  <div class="rest-fill"></div>
  <div class="rest-row">
    <span class="rest-l">Descanso</span>
    <span class="rest-t">0:00</span>
    <button data-act="restAdd">+15s</button>
    <button data-act="restStop">Pular</button>
  </div>
</div>

<nav class="tabbar">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
  <button data-tab="diet"><svg viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg><span>Dieta</span></button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg><span>Treino</span></button>
  <button data-tab="prog"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l5-6 4 3 6-8"/></svg><span>Evolução</span></button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Ajustes</span></button>
</nav>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-bg" data-act="closeSheet"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script>
'use strict';
/* =========================================================
   Fit Evolution — app pessoal de recomposição corporal
   Dados salvos só no aparelho (localStorage + IndexedDB p/ fotos)
   ========================================================= */

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const fmt = (n, d = 0) => (+n || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = (n, d = 1) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n), d);
const DOW = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const DOWS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

function calcGoals({ sexo, idade, altura, peso, ativ, obj }) {
  const bmr = 10 * peso + 6.25 * altura - 5 * idade + (sexo === 'F' ? -161 : 5);
  const tdee = bmr * ativ, kcal = Math.round(tdee * (1 - obj) / 10) * 10;
  const p = Math.round(peso * (sexo === 'F' ? 1.8 : 2.0)), g = Math.round(peso * (sexo === 'F' ? 0.9 : 0.8));
  const c = Math.max(0, Math.round((kcal - p * 4 - g * 9) / 4));
  return { tdee: Math.round(tdee), kcal, p, c, g };
}

// ---------- fotos (IndexedDB) ----------
const idb = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('fitevolution', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode); const st = t.objectStore('photos');
      const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    });
  },
  all() { return this.tx('readonly', st => st.getAll()); },
  put(rec) { return this.tx('readwrite', st => st.put(rec)); },
  del(id) { return this.tx('readwrite', st => st.delete(id)); },
  clear() { return this.tx('readwrite', st => st.clear()); },
};

function ring(v, goal) {
  const r = 54, C = 2 * Math.PI * r, pct = Math.min(1, goal ? v / goal : 0);
  return `<svg viewBox="0 0 128 128" class="ring"><circle cx="64" cy="64" r="${r}" class="ring-bg"/><circle cx="64" cy="64" r="${r}" class="ring-fg ${v > goal * 1.03 ? 'over' : ''}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" transform="rotate(-90 64 64)"/></svg>`;
}
function macroBar(label, cls, v, goal) {
  return `<div><div class="mbar-top"><span><i class="dot ${cls}"></i>${label}</span><span class="num"><b>${fmt(v)}</b> / ${fmt(goal)} g</span></div><div class="track"><div class="fill ${cls}" style="width:${Math.min(100, goal ? v / goal * 100 : 0)}%"></div></div></div>`;
}
function kcalCard(t, title, sub = '') {

    <div class="mbars">

      ${macroBar('Proteína', 'p', t.p, G.p)}${macroBar('Carboidrato', 'c', t.c, G.c)}${macroBar('Gordura', 'g', t.g, G.g)}
    </div></div></div>`;
}

function lineChart(series, { h = 180, d = 1 } = {}) {
  const all = series.flatMap(s => s.pts).filter(p => isFinite(p.y));
  if (all.length < 2) return '<div class="empty">Registre pelo menos 2 valores para ver o gráfico.</div>';
  const xs = all.map(p => parse(p.x).getTime()), ys = all.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) x1 = x0 + 864e5;
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pd = (y1 - y0) * 0.18 || 1; y0 -= pd; y1 += pd;
  const W = 340, H = h, L = 36, R = 8, T = 8, B = 22;
  const sx = t => L + (t - x0) / (x1 - x0) * (W - L - R), sy = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, y = sy(v); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 5}" y="${y + 3}" text-anchor="end">${fmt(v, d)}</text>`; }
  const xl = [x0, (x0 + x1) / 2, x1].map((t, i) => { const dt = new Date(t); return `<text x="${sx(t)}" y="${H - 5}" text-anchor="${['start', 'middle', 'end'][i]}">${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}</text>`; }).join('');
  const paths = series.map(s => {
    const pts = s.pts.filter(p => isFinite(p.y)).map(p => [sx(parse(p.x).getTime()), sy(p.y)]);
    if (!pts.length) return '';
    const line = pts.length > 1 ? `<path d="M${pts.map(p => p.join(',')).join('L')}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="4 4"' : ''}/>` : '';
    const dots = s.dots ? pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${s.r || 2.6}" fill="${s.color}"/>`).join('') : '';
    return line + dots;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}${xl}${paths}</svg>`;
}

function exCard(e, d, log) {
  const sets = log[e.id] || [], n = +e.series || 0, last = lastSession(e.id, d);
  const allOk = n && sets.filter(s => s.ok).length >= n;
  let rows = '';
  for (let i = 0; i < n; i++) {

      <input inputmode="decimal" data-set="${e.id}|${i}|kg" value="${s.kg ?? ''}" placeholder="${ls ? fmt(ls.kg, 1).replace(',0', '') : 'kg'}">
      <input inputmode="numeric" data-set="${e.id}|${i}|reps" value="${s.reps ?? ''}" placeholder="${ls ? ls.reps : 'reps'}">
      <button class="chk ${s.ok ? 'on' : ''}" data-act="setOk" data-ex="${e.id}" data-i="${i}" aria-label="Concluir série">${ICON_CHECK}</button></div>`;
  }
  return `<div class="ex ${allOk ? 'done' : ''}">
    <div class="ex-top"><button data-act="demo" data-id="${e.id}" aria-label="Ver como fazer">${demoBox(demoId(e))}</button>

    <div class="set-lbl"><span>#</span><span>kg</span><span>reps</span><span></span></div>${rows}</div>`;

const fmtRest = s => s >= 60 ? `${Math.floor(s / 60)}:${pad(s % 60)} min` : `${s}s`;
function sheetExHist(id) {
  let ex; Object.values(S.plan).forEach(p => p.ex.forEach(e => { if (e.id === id) ex = e; }));
  const sess = Object.keys(S.wlogs).sort().filter(d => (S.wlogs[d][id] || []).some(s => s.ok)).map(d => {

function trendInsight() {
  const wk = weeklyAvgs(sortedW()).filter(w => w.week <= weekStart(today()));
  const last = wk.slice(-3);
  if (last.length < 3) return `<div class="insight">Registre o peso pela manhã por <b>2–3 semanas</b>. A análise usa médias semanais, não o número de um dia.</div>`;
  const rate = (last[2].avg - last[0].avg) / 2, pct = rate / last[2].avg * 100;
  const wa = weeklyAvgs(sortedWaist().map(x => ({ date: x.date, kg: x.cm })));
  const waTxt = wa.length >= 2 ? ` Cintura: ${sgn(wa[wa.length - 1].avg - wa[Math.max(0, wa.length - 3)].avg)} cm no período.` : '';
  if (rate > -0.1) return `<div class="insight w"><b>Peso estável nas últimas semanas</b> (${sgn(rate, 2)} kg/sem).${waTxt} Se a cintura também não caiu, uma opção é reduzir ~100–200 kcal (de carbo ou gordura, mantendo a proteína) e reavaliar em 2–3 semanas.</div>`;
  if (pct < -1) return `<div class="insight w"><b>Queda rápida</b> (${sgn(rate, 2)} kg/sem · ${fmt(pct, 1)}%).${waTxt} Se força ou recuperação caírem, considere subir ~100–200 kcal para preservar massa muscular.</div>`;
  return `<div class="insight"><b>Ritmo consistente</b>: ${sgn(rate, 2)} kg/semana (${fmt(pct, 1)}% do peso).${waTxt} Mantenha o plano e continue acompanhando.</div>`;
}

async function handlePhoto(file, pose) {
  if (!file) return;
  try {
    const data = await compress(file, 1000, 0.78);
    const rec = { id: uid(), date: today(), pose, data, profile: CUR };
    await idb.put(rec); await loadPhotos(); render(); toast(`Foto (${pose}) salva`);
  } catch (e) { toast('Não foi possível salvar a foto'); }
}
function compress(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}

    <button class="btn block" data-act="saveProfile">Salvar perfil</button></div>
  <div class="card"><h3>Lembretes no início</h3>
    ${sw('rem.peso', rem.peso, 'Peso diário')}${sw('rem.cintura', rem.cintura, 'Cintura semanal')}${sw('rem.fotos', rem.fotos, 'Fotos a cada 15 dias')}${sw('rem.revisao', rem.revisao, 'Revisão aos domingos')}</div>
  <div class="card"><h3>Treino</h3>${sw('rest', S.prefs.rest, 'Timer de descanso automático', 'Inicia ao concluir uma série')}${sw('sound', S.prefs.sound, 'Som e vibração no fim do descanso')}</div>
  <div class="card"><h3>Dados</h3>
    <button class="list-it" data-act="foods"><div class="grow" style="font-weight:600">Biblioteca de alimentos</div><span class="muted">${S.foods.length} ›</span></button>
    ${window.__installPrompt ? `<button class="list-it" data-act="install"><div class="grow" style="font-weight:600">Instalar app no aparelho</div><span class="muted">›</span></button>` : ''}
    <button class="list-it" data-act="export"><div class="grow"><div style="font-weight:600">Exportar backup</div><div class="small muted">Arquivo .json com tudo, incluindo fotos</div></div><span class="muted">›</span></button>
    <button class="list-it" data-act="import"><div class="grow"><div style="font-weight:600">Importar backup</div><div class="small muted">Substitui os dados atuais</div></div><span class="muted">›</span></button>
    <button class="list-it" data-act="wipe"><div class="grow" style="font-weight:600;color:var(--bad)">Apagar todos os dados</div></button></div>
  <p class="foot">Fit Evolution · dados salvos apenas neste aparelho, sem conta e sem servidor.<br>Não substitui avaliação de nutricionista ou profissional de educação física.</p>`;
}
async function doExport() {
  await loadPhotos();
  const blob = new Blob([JSON.stringify({ app: 'fitevolution', at: new Date().toISOString(), state: S, photos: PHOTOS })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `fit-evolution-${CUR}-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Backup exportado');
}
async function doImport(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'fitevolution' || !d.state) throw 0;
    S = { ...defaults(), ...d.state }; save(); applyTheme();
    for (const p of PHOTOS) await idb.del(p.id); for (const p of d.photos || []) await idb.put({ ...p, profile: CUR });
    await loadPhotos(); render(true); toast('Backup restaurado');
  } catch (e) { toast('Arquivo de backup inválido'); }
}

// ---------- sheet / toast ----------
let SHEET_CTX = {};
function openSheet(html) {
  $('#sheet').innerHTML = `<div class="grab"></div><button class="sheet-x" data-act="closeSheet" aria-label="Fechar">✕</button>${html}`;
  $('#sheetWrap').hidden = false; document.body.style.overflow = 'hidden';
}
function closeSheet() { $('#sheetWrap').hidden = true; document.body.style.overflow = ''; SHEET_CTX = {}; }
function confirmSheet(title, text, label, fn) {
  openSheet(`<h2>${title}</h2><p class="muted">${text}</p><div class="row" style="margin-top:14px"><button class="btn grow" data-act="closeSheet">Cancelar</button><button class="btn danger grow" id="cf_ok">${label}</button></div>`);
  $('#cf_ok').onclick = () => { closeSheet(); fn(); };
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2000); }

// ---------- timer de descanso ----------
const timer = { end: 0, total: 0, int: null };
function startRest(sec) {
  if (!S.prefs.rest || !sec) return;
  timer.total = sec; timer.end = Date.now() + sec * 1000; clearInterval(timer.int); timer.int = setInterval(tick, 250); tick();
}
function tick() {
  const el = $('#rest'), left = Math.ceil((timer.end - Date.now()) / 1000);
  if (left <= 0) { stopRest(); if (S.prefs.sound) { beep(); navigator.vibrate?.([200, 100, 200]); } toast('Descanso finalizado — próxima série!'); return; }
  el.hidden = false; $('.rest-t', el).textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
  $('.rest-fill', el).style.width = Math.min(100, left / timer.total * 100) + '%';
}
function stopRest() { clearInterval(timer.int); $('#rest').hidden = true; }
let actx;
function beep() {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.25, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t + 0.2); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.22); });
  } catch (e) { /* sem áudio */ }
}

// ---------- ações ----------
let photoPose = 'Frente';
const A = {
  tab: ds => { UI.tab = ds.k; render(true); },
  dDate: ds => { UI.dDate = addDays(UI.dDate, +ds.n); render(); },
  tDate: ds => { UI.tDate = addDays(UI.tDate, +ds.n); render(); },
  tSeg: ds => { UI.tSeg = ds.k; render(); },
  pSeg: ds => { UI.pSeg = ds.k; render(); },
  goPhotos: () => { UI.tab = 'prog'; UI.pSeg = 'fotos'; render(true); },
  goProg: () => { UI.tab = 'prog'; UI.pSeg = 'peso'; render(true); },
  closeSheet: () => closeSheet(),
  addFood: ds => sheetAddFood(ds.m),
  pickFood: ds => sheetQty({ food: S.foods.find(f => f.id === ds.id), meal: ds.m }),
  newFood: ds => sheetFoodForm(null, ds.m),
  editFood: ds => sheetFoodForm(ds.id),
  delFood: ds => confirmSheet('Excluir alimento?', 'Registros antigos do diário não são afetados.', 'Excluir', () => { S.foods = S.foods.filter(f => f.id !== ds.id); save(); sheetFoods(); }),
  foods: () => sheetFoods(),
  editItem: ds => { const it = (S.diary[UI.dDate][ds.m] || []).find(i => i.id === ds.id); if (it) sheetQty({ item: it, meal: ds.m }); },
  delItem: ds => { const arr = S.diary[UI.dDate][ds.m]; arr.splice(arr.findIndex(i => i.id === ds.id), 1); save(); closeSheet(); render(); toast('Removido'); },
  copyDay: () => {
    const prev = S.diary[addDays(UI.dDate, -1)];
    if (!prev || !MEALS.some(m => (prev[m.k] || []).length)) return toast('Dia anterior está vazio');
    const go = () => { S.diary[UI.dDate] = Object.fromEntries(MEALS.map(m => [m.k, (prev[m.k] || []).map(i => ({ ...i, id: uid() }))])); save(); render(); toast('Refeições copiadas'); };
    dayItems(UI.dDate).length ? confirmSheet('Substituir o dia?', 'Os alimentos já registrados hoje serão trocados pelos do dia anterior.', 'Substituir', go) : go();
  },
  setOk: ds => {
    const d = UI.tDate, log = (S.wlogs[d] ||= {}), sets = (log[ds.ex] ||= []), i = +ds.i, s = (sets[i] ||= {});
    if (!s.ok) {
      const last = lastSession(ds.ex, d), ls = last && last.sets[i];
      const row = $(`[data-set="${ds.ex}|${i}|kg"]`).closest('.set');
      const kg = num($('[data-set$="|kg"]', row).value), reps = parseInt($('[data-set$="|reps"]', row).value);
      s.kg = !isNaN(kg) ? kg : (ls ? ls.kg : NaN); s.reps = !isNaN(reps) ? reps : (ls ? ls.reps : NaN);
      if (isNaN(s.kg) || isNaN(s.reps)) { delete s.kg; delete s.reps; return toast('Preencha kg e repetições'); }
      s.ok = true;
      let ex; Object.values(S.plan).forEach(p => p.ex.forEach(e => { if (e.id === ds.ex) ex = e; }));
      startRest(ex ? +ex.descanso : 90);
    } else s.ok = false;
    save(); const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  exHist: ds => sheetExHist(ds.id),
  who: ds => switchProfile(ds.k),
  applyCalc: () => {
    const r = readCalc(); if (!r) return toast('Preencha idade, altura e peso');
    Object.assign(S.goals, { kcal: r.kcal, p: r.p, c: r.c, g: r.g }); Object.assign(S.profile, { sexo: $('#k_s').value, idade: $('#k_i').value, altura: $('#k_a').value });
    const kg = num($('#k_p').value); if (kg > 0 && !S.weights.some(w => w.date === today())) S.weights.push({ date: today(), kg });
    S.goalsSet = true; save(); render(); toast('Metas atualizadas');
  },
  demo: ds => {
    let ex; Object.values(S.plan).forEach(p => p.ex.forEach(e => { if (e.id === ds.id) ex = e; }));
    if (!ex) return; const id = demoId(ex);
    openSheet(`<h2>${esc(ex.nome)}</h2>${id ? demoBox(id, true) + `<p class="small muted" style="margin:10px 0 0">Alterna entre a posição inicial e a final do movimento. Faça a descida controlada e mantenha a postura.</p>`
      : `<div class="empty">Sem demonstração para este exercício. Escolha uma em <b>Editar ficha</b>.</div>`}
      <div class="row" style="margin-top:14px"><button class="btn grow" data-act="exHist" data-id="${ex.id}">Ver histórico</button><button class="btn pri grow" data-act="closeSheet">Fechar</button></div>
      <p class="foot">Imagens: Free Exercise DB (domínio público). Precisa de internet na primeira vez; depois ficam salvas.</p>`);
  },
  editPlan: ds => sheetPlan(+ds.d),
  addCardio: () => sheetCardio(),
  editCardio: ds => sheetCardio(ds.id),
  delCardio: ds => { S.cardio = S.cardio.filter(c => c.id !== ds.id); save(); closeSheet(); render(); toast('Excluído'); },
  addWeight: () => sheetMeasure('w'),
  addWaist: () => sheetMeasure('c'),
  editWeight: ds => sheetMeasure('w', ds.d),
  editWaist: ds => sheetMeasure('c', ds.d),
  delMeasure: ds => { const k = ds.k === 'w' ? 'weights' : 'waist'; S[k] = S[k].filter(x => x.date !== ds.d); save(); closeSheet(); render(); toast('Excluído'); },
  addPhoto: ds => { photoPose = ds.k; $('#filePhoto').value = ''; $('#filePhoto').click(); },
  viewPhoto: ds => {
    const p = PHOTOS.find(x => x.id === ds.id); if (!p) return;
    openSheet(`<h2>${p.pose} · ${shortDate(p.date)}</h2><img src="${p.data}" style="width:100%;border-radius:12px;display:block" alt="">
      <div class="grid2" style="margin-top:12px"><div class="fld"><label>Data</label><input type="date" id="ph_d" value="${p.date}" max="${today()}"></div><div class="fld"><label>Pose</label><select id="ph_p">${POSES.map(x => `<option ${x === p.pose ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
      <div class="row"><button class="btn danger" id="ph_del">Excluir</button><button class="btn pri grow" id="ph_ok">Salvar</button></div>`);
    $('#ph_ok').onclick = async () => { p.date = $('#ph_d').value || p.date; p.pose = $('#ph_p').value; await idb.put(p); await loadPhotos(); closeSheet(); render(); };
    $('#ph_del').onclick = () => confirmSheet('Excluir foto?', 'Essa ação não pode ser desfeita.', 'Excluir', async () => { await idb.del(p.id); await loadPhotos(); render(); });
  },
  restAdd: () => { timer.end += 15000; timer.total += 15; tick(); },
  restStop: () => stopRest(),
  saveGoals: () => {
    const v = id => num($(id).value);
    const g = { kcal: v('#g_kcal'), p: v('#g_p'), c: v('#g_c'), g: v('#g_g') };
    if (Object.values(g).some(x => !(x >= 0))) return toast('Revise os valores');
    Object.assign(S.goals, g, { pesoMeta: $('#g_pm').value.trim(), cinturaMeta: $('#g_cm').value.trim() }); S.goalsSet = true; save(); render(); toast('Metas salvas');
  },
  saveProfile: () => { Object.assign(S.profile, { nome: $('#pf_n').value.trim(), idade: $('#pf_i').value.trim(), altura: $('#pf_a').value.trim(), foco: $('#pf_f').value.trim() }); save(); render(); toast('Perfil salvo'); },
  install: async () => { const p = window.__installPrompt; if (!p) return; p.prompt(); await p.userChoice; window.__installPrompt = null; render(); },
  export: () => doExport(),
  import: () => { $('#fileImport').value = ''; $('#fileImport').click(); },
  wipe: () => confirmSheet('Apagar tudo?', 'Diário, treinos, medidas e fotos serão removidos deste aparelho. Exporte um backup antes, se quiser.', 'Apagar tudo', async () => { localStorage.removeItem(keyFor(CUR)); for (const p of PHOTOS) await idb.del(p.id); S = defaults(); save(); PHOTOS = []; render(true); toast('Dados apagados'); }),
};

document.addEventListener('click', e => {
  const tb = e.target.closest('.tabbar button'); if (tb) { UI.tab = tb.dataset.tab; render(true); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = SHEET_CTX[el.dataset.act] || A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.set) {
    const [ex, i, k] = t.dataset.set.split('|'), log = (S.wlogs[UI.tDate] ||= {}), sets = (log[ex] ||= []), s = (sets[+i] ||= {});
    const v = k === 'kg' ? num(t.value) : parseInt(t.value);
    if (isNaN(v)) delete s[k]; else s[k] = v;
    save();
  }
  if (['g_kcal', 'g_p', 'g_c', 'g_g'].includes(t.id)) {
    const c = Math.round(num($('#g_p').value) * 4 + num($('#g_c').value) * 4 + num($('#g_g').value) * 9), k = num($('#g_kcal').value);
    $('#g_hint').innerHTML = `Macros somam ${fmt(c || 0)} kcal${Math.abs(c - k) > 50 ? ' <span class="warn">(diferente da meta)</span>' : ''}.`;
  }
});
function readCalc() {
  const v = { sexo: $('#k_s').value, idade: num($('#k_i').value), altura: num($('#k_a').value), peso: num($('#k_p').value), ativ: num($('#k_at').value), obj: num($('#k_o').value) };
  return v.idade > 0 && v.altura > 0 && v.peso > 0 ? calcGoals(v) : null;
}
function updCalc() {
  const o = $('#k_out'); if (!o) return; const r = readCalc();
  o.innerHTML = r ? `<div><b class="num">${fmt(r.kcal)}</b><span>kcal</span></div><div><b class="num">${r.p}</b><span>prot</span></div><div><b class="num">${r.c}</b><span>carb</span></div><div><b class="num">${r.g}</b><span>gord</span></div>` : '<div style="grid-column:1/-1"><span>Preencha idade, altura e peso</span></div>';
}
document.addEventListener('input', e => { if (e.target.id && e.target.id.startsWith('k_')) updCalc(); });
document.addEventListener('change', e => {
  if (e.target.id && e.target.id.startsWith('k_')) updCalc();
  const t = e.target;
  if (t.dataset.pref) { const p = t.dataset.pref.split('.'); if (p.length === 2) S.prefs[p[0]][p[1]] = t.checked; else S.prefs[p[0]] = t.checked; save(); }
  if (t.dataset.cmp) { const k = t.dataset.cmp; if (k === 'pose') { UI.cmpPose = t.value; UI.cmpA = UI.cmpB = null; } else UI[k === 'a' ? 'cmpA' : 'cmpB'] = t.value; render(); }
});
$('#filePhoto').addEventListener('change', e => handlePhoto(e.target.files[0], photoPose));
$('#fileImport').addEventListener('change', e => { const f = e.target.files[0]; if (f) confirmSheet('Importar backup?', 'Os dados atuais deste aparelho serão substituídos pelos do arquivo.', 'Importar', () => doImport(f)); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet(); });

// ---------- PWA ----------
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installPrompt = e; if (UI.tab === 'more') render(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});

// atualiza "hoje" se o app ficar aberto de um dia pro outro
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); UI.dDate = UI.tDate = lastDay; render(); } });

loadPhotos().then(() => render(true));
render(true);

</script>
</body>
</html>
